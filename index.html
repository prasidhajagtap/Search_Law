<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Shield - Smart Translation</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #262626;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
        }
        .search-box-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 15px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #333;
            color: #fff;
        }
        input { flex: 1; }
        button {
            background-color: #ff9900;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { background-color: #ffb347; }
        
        /* Language Selector Stones */
        .lang-bar {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .lang-btn {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        .lang-btn.active {
            background-color: #0099ff;
            color: #fff;
            border-color: #0099ff;
        }

        .result-box {
            display: none;
            background-color: #333;
            padding: 20px;
            border-radius: 6px;
            border-left: 5px solid #ff9900;
        }
        .action-zone {
            background-color: #2b3a2b;
            border-left: 5px solid #28a745;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .optional-links {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #555;
            font-size: 14px;
        }
        .case-link {
            display: block;
            margin-top: 5px;
            color: #0099ff;
            text-decoration: none;
        }
        .status { color: #aaa; font-style: italic; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Law Shield Core</h1>
    
    <div class="search-box-container">
        <input type="text" id="searchBox" placeholder="Enter Section Number (e.g., 85)...">
        <button onclick="huntDataPit()">Search</button>
    </div>
    
    <div id="langBar" class="lang-bar">
        <button class="lang-btn active" id="btn-en" onclick="switchLang('en')">English</button>
        <button class="lang-btn" id="btn-hi" onclick="switchLang('hi')">हिंदी (Hindi)</button>
        <button class="lang-btn" id="btn-mr" onclick="switchLang('mr')">मराठी (Marathi)</button>
    </div>
    
    <div id="statusMessage" class="status">Hunting...</div>

    <div id="output" class="result-box">
        <h2 id="lawTitle"></h2>
        
        <h3>1. Law Simplified:</h3>
        <p id="lawSimpleText"></p>
        
        <div class="action-zone">
            <h3>2. Immediate Next Steps for Man:</h3>
            <p id="lawNextSteps"></p>
        </div>
        
        <div class="optional-links" id="optionalLinksZone">
            <!-- Verifiable Case Links Show Up Here Dynamically -->
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://kgbcygfemcdorqryvxdp.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYmN5Z2ZlbWNkb3Jxcnl2eGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzUxNDAsImV4cCI6MjA5NTM1MTE0MH0.XPc2iS9rfmrwRh6f_1IGIiIr1wbqzafJPXnk389yLT0";
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeLawData = null; // Holds the current live data stone

    async function huntDataPit() {
        const rawInput = document.getElementById('searchBox').value.trim();
        const outputBox = document.getElementById('output');
        const statusBox = document.getElementById('statusMessage');
        const langBar = document.getElementById('langBar');

        if (!rawInput) return;

        outputBox.style.display = "none";
        langBar.style.display = "none";
        statusBox.style.display = "block";

        try {
            const numMatch = rawInput.match(/\d+/);
            if (!numMatch) {
                statusBox.innerText = "Error: Please enter a valid numerical section number.";
                return;
            }

            const { data, error } = await sbClient
                .from('laws')
                .select(`
                    code_type, section_number, title, simple_text, next_steps,
                    simple_text_hi, next_steps_hi, simple_text_mr, next_steps_mr,
                    law_judgments ( judgments ( case_name, reference_url ) )
                `)
                .eq('section_number', numMatch[0])
                .limit(1);

            statusBox.style.display = "none";
            if (error) throw error;

            if (data && data.length > 0) {
                activeLawData = data[0];
                langBar.style.display = "flex";
                switchLang('en'); // Default to English display
                outputBox.style.display = "block";
            } else {
                statusBox.style.display = "block";
                statusBox.innerText = "No match inside the data pit.";
            }
        } catch (err) {
            console.error(err);
            statusBox.innerText = "Pit connection error.";
        }
    }

    function switchLang(lang) {
        if (!activeLawData) return;

        // Reset active status on buttons
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${lang}`).classList.add('active');

        const titleBox = document.getElementById('lawTitle');
        const textBox = document.getElementById('lawSimpleText');
        const stepsBox = document.getElementById('lawNextSteps');
        const linksZone = document.getElementById('optionalLinksZone');

        // Render based on selected language block
        if (lang === 'hi') {
            titleBox.innerText = `${activeLawData.code_type} धारा ${activeLawData.section_number}`;
            textBox.innerText = activeLawData.simple_text_hi || "अनुवाद उपलब्ध नहीं है।";
            stepsBox.innerText = activeLawData.next_steps_hi || "कोई कदम दर्ज नहीं किया गया।";
        } else if (lang === 'mr') {
            titleBox.innerText = `${activeLawData.code_type} कलम ${activeLawData.section_number}`;
            textBox.innerText = activeLawData.simple_text_mr || "भाषांतर उपलब्ध नाही.";
            stepsBox.innerText = activeLawData.next_steps_mr || "पुढील पावले उपलब्ध नाहीत.";
        } else {
            // English default
            titleBox.innerText = `${activeLawData.code_type} Section ${activeLawData.section_number}: ${activeLawData.title}`;
            textBox.innerText = activeLawData.simple_text;
            stepsBox.innerText = activeLawData.next_steps || "No next steps defined.";
        }

        // Render completely optional case links at the bottom
        let linksHTML = "<strong>Optional Verification Links:</strong>";
        const relations = activeLawData.law_judgments || [];
        if (relations.length > 0) {
            relations.forEach(r => {
                if (r.judgments) {
                    linksHTML += `<a class="case-link" href="${r.judgments.reference_url}" target="_blank">Verify Verdict: ${r.judgments.case_name} ↗</a>`;
                }
            });
        } else {
            linksHTML += "<p style='color:#777; margin:5px 0 0 0;'>No external citations linked.</p>";
        }
        linksZone.innerHTML = linksHTML;
    }
</script>

</body>
</html>
