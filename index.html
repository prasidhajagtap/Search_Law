<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Shield - Live Pit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #262626;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .search-box-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #333;
            color: #fff;
        }
        input:focus {
            outline: 2px solid #ff9900;
        }
        button {
            padding: 0 25px;
            font-size: 16px;
            background-color: #ff9900;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ffb347;
        }
        .result-box {
            display: none;
            background-color: #333;
            padding: 20px;
            border-radius: 6px;
            border-left: 5px solid #ff9900;
        }
        .case-law {
            background-color: #444;
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid #0099ff;
        }
        a {
            color: #0099ff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .status {
            color: #aaa;
            font-style: italic;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Law Shield Search</h1>
    
    <div class="search-box-container">
        <input type="text" id="searchBox" placeholder="Enter section number or keyword (e.g., 85, 498A, DV)...">
        <button onclick="huntDataPit()">Search</button>
    </div>
    
    <div id="statusMessage" class="status">Hunting in pit...</div>

    <div id="output" class="result-box">
        <h2 id="lawTitle"></h2>
        <p id="lawSimpleText"></p>
        <div id="casesArea"></div>
    </div>
</div>

<script>
    // PUT YOUR REAL SUPABASE CREDS HERE
    const SUPABASE_URL = "https://kgbcygfemcdorqryvxdp.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYmN5Z2ZlbWNkb3Jxcnl2eGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzUxNDAsImV4cCI6MjA5NTM1MTE0MH0.XPc2iS9rfmrwRh6f_1IGIiIr1wbqzafJPXnk389yLT0";

   // FIX: Use 'sbClient' because CDN already claim 'supabase' name
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function huntDataPit() {
        const input = document.getElementById('searchBox').value.trim();
        const outputBox = document.getElementById('output');
        const statusBox = document.getElementById('statusMessage');
        const titleBox = document.getElementById('lawTitle');
        const textBox = document.getElementById('lawSimpleText');
        const casesArea = document.getElementById('casesArea');

        if (!input) return;

        outputBox.style.display = "none";
        statusBox.style.display = "block";
        statusBox.innerText = "Hunting in pit...";

        try {
            // Use new variable name here to hunt
            const { data, error } = await sbClient
                .from('laws')
                .select(`
                    id,
                    code_type,
                    section_number,
                    title,
                    simple_text,
                    law_judgments (
                        judgments (
                            case_name,
                            summary,
                            reference_url
                        )
                    )
                `)
                .or(`section_number.eq.${input},title.ilike.%${input}%,simple_text.ilike.%${input}%`)
                .limit(1);

            statusBox.style.display = "none";

            if (error) throw error;

            if (data && data.length > 0) {
                const law = data;
                titleBox.innerText = `${law.code_type} Section ${law.section_number}: ${law.title}`;
                textBox.innerText = law.simple_text;

                let caseHTML = "<h3>Shield Judgments (Men Rights):</h3>";
                const relationships = law.law_judgments || [];
                
                if (relationships.length > 0) {
                    relationships.forEach(rel => {
                        if (rel.judgments) {
                            const c = rel.judgments;
                            caseHTML += `
                                <div class="case-law">
                                    <strong>${c.case_name}</strong>
                                    <p>${c.summary}</p>
                                    <a href="${c.reference_url}" target="_blank">Verify Verdict ↗</a>
                                </div>`;
                        }
                    });
                } else {
                    caseHTML += "<p>No specific shield judgment tied to this section yet.</p>";
                }

                casesArea.innerHTML = caseHTML;
                outputBox.style.display = "block";
            } else {
                statusBox.style.display = "block";
                statusBox.innerText = "No laws found in pit for that query.";
            }

        } catch (err) {
            console.error(err);
            statusBox.style.display = "block";
            statusBox.innerText = "Error! Machine broken or wrong credentials.";
        }
    }
</script>
</body>
</html>
